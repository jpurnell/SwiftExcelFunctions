# `excludedCheckers` and `enabledCheckers`, not `exclude` and `checkers`.
#
# The gate ignores keys it does not recognise, so the superseded names produced a file
# that described a checker selection which never ran — the defaults ran instead, and the
# mismatch surfaced only as an advisory note. A survey on 2026-08-25 found 11 of 73
# repositories carrying the old names, every one of them scaffolded from here.
#
# Not `excludePatterns`, which is what the gate's own "did you mean" suggests: that key
# holds file globs, so taking the suggestion turns a checker name into a pattern that
# matches nothing and excludes nothing.
excludedCheckers:
  - disk-clean

enabledCheckers:
  - all
  - logging

# Without this the status auditor looks for a master plan inside the framework's own
# directory, finds none, and skips. A checker that skips is not a checker that passed.
status:
  guidelinesPath: "."
  masterPlanPath: project/master_plan.md

# Not a suppression: `justified` still reports every weak hash that does not carry a
# written reason on the line above it. It exists because ECMA-376 encrypted workbooks name
# SHA-1 inside the file — WorkbookContainer either computes it or cannot open the document,
# and "use SHA-256 instead" is not a choice anyone here gets to make. The mechanism is the
# one already required for `@unchecked Sendable`: say why, where a reviewer will read it.
security:
  weakCryptoPolicy: justified

consistency:
  corpusPath: /Users/jpurnell/Dropbox/Computer/Development/Swift/Tools/org-judgement-corpus
  projectID: SwiftExcelFunctions
  consistencyThreshold: 0.7
  defaultRiskTier: 2

ijs:
  projectID: "SwiftExcelFunctions"
  corpusPath: "/Users/jpurnell/Dropbox/Computer/Development/Swift/Tools/org-judgement-corpus"
  decisionOwner: "jpurnell"
  defaultRiskTier: 2
  remoteURL: "git@github.com:jpurnell/org-judgement-corpus.git"

# Not a suppression: this declares *where* the contained spawn site is, which the rule needs
# and cannot infer. The default `kernelPath` points at `Sources/QualityGateCore/ProcessRunner.swift`
# and, as the auditor's own documentation says, matches no file in any repository — so without
# this key every correct fix still fails the rule.
#
# The shared `swift-process-kernel` runner was the first thing tried and is the wrong tool for
# the one spawn here. It reads the child through pipes and returns its output after the child
# exits. The child in question is a corpus pass whose stderr *is* its progress, and a tool that
# withholds progress until the end is the exact failure `name-round-trip` was rewritten twice to
# escape. So this kernel inherits stdio instead, has no pipes to drain, and bounds the wait with
# a deadline.
boundedIO:
  kernelPath: Sources/NameRoundTrip/ProcessRunner.swift
